[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4cyber-fraud"
version = "0.1.0"
description = "Reproducible bank-account-opening fraud screening experiments for COS30049 Assignment 2"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]
download = ["kaggle>=1.6,<2"]

[project.scripts]
ai4cyber-train = "ai4cyber.training:main"
ai4cyber-cluster = "ai4cyber.clustering:main"
ai4cyber-predict = "ai4cyber.inference:main"
ai4cyber-profile = "ai4cyber.profiling:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

